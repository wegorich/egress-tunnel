# HTTP CONNECT proxy for AI agents on laptops. Loopback only: reached exclusively
# through an SSH port-forward, so there is nothing to expose or authenticate.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 64
Allow 127.0.0.1
ViaProxyName "egress"
DisableViaHeader Yes
ConnectPort 443
ConnectPort 80
