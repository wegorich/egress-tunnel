  # Whole networks, not single addresses. Cloudflare rotates chatgpt, openai,
  # cursor and grok inside these published ranges. A host route is already gone
  # while the app still uses the previous answer, and that packet leaves by the
  # home line. Pinning the network keeps the destination stable.
  # Source: https://www.cloudflare.com/ips-v4 on 2026-10-07, plus two small
  # Cloudflare blocks that are not in that list yet, plus Anthropic's own net.
  prefixes:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 8.6.112.0/24
    - 8.47.69.0/24
    - 160.79.104.0/23

  # If one of these names resolves outside the list above, pin that whole /24
  # and keep it for a day. cursorvm and S3 stay host routes: those addresses
  # are dedicated machines, not a shared anycast pool.
  learn_prefix_suffixes:
    - chatgpt.com
    - openai.com
    - oaistatic.com
    - oaiusercontent.com
    - anthropic.com
    - claude.ai
    - claude.com
    - claudeusercontent.com
    - grok.com
    - x.ai
    - cursor.sh
    - cursor.com
    - cursorapi.com
    - cursor-cdn.com
    - workos.com

healthcheck:
  probe_url: "https://api.anthropic.com/"
  probe_interval_sec: 20
  # WireGuard renews the handshake on its own REKEY_AFTER_TIME timer (120s) and
  # only treats a session as dead at REJECT_AFTER_TIME (180s). PersistentKeepalive
  # holds the NAT mapping open; it does NOT refresh the handshake, so a threshold
  # below 180 fires on a perfectly healthy tunnel. Measured 2026-09-21: the age
  # climbs to 120s every cycle, so the old 75 spent ~45s of every cycle calling a
  # live channel dead, ripping out the AI-domain routes and leaking that traffic
  # to the blocked direct path. 180 is the only age at which the channel is
  # genuinely gone.
  handshake_timeout_sec: 180
  fallback_after_failures: 3     # this many consecutive failures -> routes are removed
  recovery_after_successes: 3    # this many consecutive successes -> routes are restored
  resolve_interval_sec: 15       # learn a new block quickly; pinned nets do not depend on this
  # Host routes only, for addresses outside the pinned networks.
  route_hold_sec: 1800
  learn_prefix_len: 24
  learn_prefix_hold_sec: 86400
