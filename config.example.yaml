    - claude.ai
    - claude.com
    - platform.claude.com
    - bridge.claudeusercontent.com
    - api.openai.com
    - auth.openai.com
    - chatgpt.com
    # ChatGPT desktop and Codex call these beside chatgpt.com. A host missing
    # here leaves by the home line and comes back 403.
    - ab.chatgpt.com
    - api.chatgpt.com
    - ws.chatgpt.com
    - realtime.chatgpt.com
    - chat.openai.com
    - platform.openai.com
    - cdn.oaistatic.com
    - persistent.oaistatic.com
    - files.oaiusercontent.com

